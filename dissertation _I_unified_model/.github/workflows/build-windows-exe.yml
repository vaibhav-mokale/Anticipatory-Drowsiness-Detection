name: build windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: verify checkpoint
        shell: bash
        run: |
          test -f checkpoints/best.pth
          test -f assets/icon.ico
          ls -lh checkpoints/best.pth assets/icon.ico

      - name: install deps (cpu torch)
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: smoke import
        run: python -m app --headless

      - name: pyinstaller
        run: pyinstaller setup.spec --clean --noconfirm

      - name: list dist
        shell: bash
        run: ls -lh dist/

      - name: upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrowsinessDetection-windows
          path: dist/DrowsinessDetection.exe
          if-no-files-found: error
          retention-days: 14

      - name: attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DrowsinessDetection.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
